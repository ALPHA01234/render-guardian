name: Keep Render services awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-guardian-check
  cancel-in-progress: false
jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check configured websites
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          urls = []
          for line in Path("sites.txt").read_text(encoding="utf-8").splitlines():
              value = line.strip()
              if value and not value.startswith("#"):
                  if not value.startswith(("https://", "http://")):
                      print(f"Skipping invalid URL: {value}")
                      continue
                  if value not in urls:
                      urls.append(value)

          results = []
          for url in urls:
              started = time.monotonic()
              ok, message = False, ""
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "RenderGuardian/1.0 uptime-check"})
                  with urllib.request.urlopen(req, timeout=25) as response:
                      code = response.status
                      ok = 200 <= code < 400
                      message = f"HTTP {code}"
              except urllib.error.HTTPError as error:
                  message = f"HTTP {error.code}"
              except Exception as error:
                  message = str(error)[:180]
              elapsed = round((time.monotonic() - started) * 1000)
              results.append({"url": url, "name": url.split("//",1)[-1].split("/",1)[0], "ok": ok, "ms": elapsed, "message": message})
              print(f"{'OK' if ok else 'FAIL'} {url} — {message} ({elapsed} ms)")

          output = {"checked_at": datetime.now(timezone.utc).isoformat(), "sites": results}
          Path("status.json").write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Publish latest status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update website monitoring status"
            git push
          fi
