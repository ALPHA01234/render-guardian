name: Keep Render services awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-guardian-check
  cancel-in-progress: false
jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check configured websites
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          urls = []
          for line in Path("sites.txt").read_text(encoding="utf-8").splitlines():
              value = line.strip()
              if value and not value.startswith("#"):
                  if not value.startswith(("https://", "http://")):
                      print(f"Skipping invalid URL: {value}")
                      continue
                  if value not in urls:
                      urls.append(value)

          def check(url):
              started = time.monotonic()
              last_error = "Unknown error"
              for attempt in range(2):
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "RenderGuardian/2.0 uptime-check",
                          "Accept": "text/html,application/json,*/*",
                          "Connection": "close",
                      })
                      try:
                          response = urllib.request.urlopen(req, timeout=45)
                          code = response.status
                          response.close()
                      except urllib.error.HTTPError as error:
                          code = error.code
                          error.close()
                      reachable = 100 <= code < 600
                      healthy = 200 <= code < 400
                      message = f"HTTP {code}" if healthy else f"HTTP {code} — server reachable, but returned an error"
                      elapsed = round((time.monotonic() - started) * 1000)
                      return {"url": url, "name": url.split("//", 1)[-1].split("/", 1)[0], "ok": healthy, "reachable": reachable, "ms": elapsed, "message": message}
                  except Exception as error:
                      last_error = str(error)[:180]
                      if attempt == 0:
                          print(f"Retrying {url} after: {last_error}")
                          time.sleep(3)
              elapsed = round((time.monotonic() - started) * 1000)
              return {"url": url, "name": url.split("//", 1)[-1].split("/", 1)[0], "ok": False, "reachable": False, "ms": elapsed, "message": f"No response after 2 attempts: {last_error}"}

          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              results = list(pool.map(check, urls))
          for result in results:
              state = "ONLINE" if result["ok"] else ("REACHABLE / ERROR" if result["reachable"] else "NO RESPONSE")
              print(f'{state} {result["url"]} — {result["message"]} ({result["ms"]} ms)')
          output = {"checked_at": datetime.now(timezone.utc).isoformat(), "sites": results}
          Path("status.json").write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Publish latest status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update website monitoring status"
            git push
          fi
